<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>input demo</title>
</head>
<body>
<form action="">
  User Name : <input type="text" name="username" size="10"  placeholder="enter username" > <br>
  Password : <input type="password" size="10"> <br>
  Gender : <input type="radio"  name="gender"  value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female   <br>
  Eduction : <input type="checkbox" name="education"  value="10th">10th
              <input type="checkbox" name="education" value="12th">12th
              <input type="checkbox" name="education" value="B.com">B.Com
              <input type="checkbox" name="education" value="M.com">M.Com <br/>

  <input type="button" value="Login">
  <input type="submit" value="Login">
  <input type="reset" value="Login">

  <br>
  Course :
  <select name="course" id="">
    <option value="C">C</option>
    <option value="C++">C++</option>
    <option value="Java">Java</option>

  </select> </br>
  Course : <input list="course">

   <datalist id="course">
     <option value="C">C</option>
     <option value="C++">C++</option>
     <option value="Java">Java</option>
   </datalist>

  <br>
  
  Date : <input type="date"> <br>
  Date and time : <input type="datetime-local">
  Time : <input type="time"> <br/>
  week : <input type="week"> <br>
  month : <input type="month"> <br>
  Year : <input type="year"> <br/>
  
  <br/>
  
  color : <input type="color"> <br/>
  file : <input type="file">







</form>


</body>
</html>
